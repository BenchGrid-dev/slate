# SlateOS launcher: Spotlight-like, centred a little above the middle, frosted by SwayFX.
[main]
font=Inter:size=14,Font Awesome 7 Free:style=Solid:size=12
prompt="  "
placeholder=Search applications
width=40
lines=8
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=28
icon-theme=Colloid-Dark
icons-enabled=yes
terminal=foot -e
anchor=top
y-margin=170
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1f1f23e0
text=f2f2f7ff
placeholder=8e8e93ff
prompt=8fa7f0ff
input=f2f2f7ff
match=aec2ffff
selection=7c9cf540
selection-text=ffffffff
selection-match=d4dfffff
border=ffffff1f

[border]
width=1
radius=16
selection-radius=10
