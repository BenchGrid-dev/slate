# SlateOS window effects. SwayFX only: the module installs this file into
# /etc/slate/sway.d/ when services.slate.desktop.effects is on (the default), and plain
# sway never reads it.

# Windows: rounded, lifted off the desktop by a soft shadow, a lighter one when inactive.
corner_radius 12
smart_corner_radius disable
shadows enable
shadows_on_csd enable
shadow_blur_radius 26
shadow_offset 0 8
shadow_color #00000066
shadow_inactive_color #00000038
titlebar_separator disable
default_dim_inactive 0.0

# Translucent surfaces show a frosted copy of what is behind them. Kept light: two
# passes of a small kernel, a touch of saturation, a little grain against banding.
blur enable
blur_xray disable
blur_passes 2
blur_radius 6
blur_noise 0.02
blur_brightness 1.0
blur_contrast 1.0
blur_saturation 1.25

# The desktop's own surfaces. blur_ignore_transparent keeps the blur to their painted
# shapes (the dock is a floating pill in a full-width layer).
layer_effects "waybar" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "slate-dock" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
    corner_radius 22;
}
layer_effects "launcher" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
    corner_radius 16;
}
layer_effects "notifications" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
    corner_radius 14;
}
layer_effects "slate-shell" {
    blur enable;
    blur_ignore_transparent enable;
}

# The person's choice in Settings, Appearance ("Reduce transparency") comes last. Not a
# .conf file: the user's sway.d/*.conf is read by plain sway too, which has no blur.
include ~/.config/slate/sway.d/effects.fx
