# SlateOS terminal defaults (users override in ~/.config/foot/foot.ini).
font=JetBrains Mono:size=11
pad=14x12
initial-window-size-pixels=1000x640

[cursor]
style=beam
blink=yes

# foot picks colors-dark or colors-light from the desktop's colour scheme (settings portal).
[colors-light]
alpha=0.97
background=f7f8fb
foreground=1c1f27
regular0=e6e8ee
regular1=c0392b
regular2=2e7d32
regular3=b26a00
regular4=3b6de8
regular5=8e44ad
regular6=00838f
regular7=4a4f5c
bright0=9ba1b0
bright1=c0392b
bright2=2e7d32
bright3=b26a00
bright4=2f5fd0
bright5=8e44ad
bright6=00838f
bright7=1c1f27
selection-foreground=1c1f27
selection-background=dfe4f0

[colors-dark]
alpha=0.96
background=13151b
foreground=d7dae2
regular0=1c1f27
regular1=e06c75
