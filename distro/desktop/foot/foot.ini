regular2=98c379
regular3=e5c07b
regular4=7c9cf5
regular5=c678dd
regular6=56b6c2
regular7=abb2bf
bright0=5c6370
bright1=e06c75
bright2=98c379
bright3=e5c07b
bright4=8fa7f0
bright5=c678dd
bright6=56b6c2
bright7=ffffff
selection-foreground=ffffff
selection-background=2f3648
