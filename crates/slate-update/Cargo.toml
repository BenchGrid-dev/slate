[package]
name = "slate-update"
description = "slateos-update: finds a newer SlateOS release, builds it beside the running system, and lets the next start try it once before it becomes the default."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "slateos-update"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"
# Already in the tree through ureq's TLS: SHA-256 and Ed25519 come from here.
ring = "0.17"
base64 = "0.22"
flate2 = "1"
tar = { version = "0.4", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
