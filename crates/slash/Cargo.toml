[package]
name = "slash"
description = "The Slate shell. Natural language by default, /commands for control, !commands for raw zsh/bash."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
slate-proto.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rustyline = "15"
nix = { version = "0.29", features = ["term", "poll", "time", "fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
