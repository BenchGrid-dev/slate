[package]
name = "slate-gateway"
description = "Local gateway between the agent CLI and a model API the person brought a key for: passes Anthropic's Messages API through, or translates it to OpenAI's chat completions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ureq = "3"

[dev-dependencies]
tempfile = "3"
