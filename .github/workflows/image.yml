name: Image

# Builds the x86_64 image, installs it in a virtual machine and boots what was installed
# (tests/image/install_test.py): once without a network on a plain disk (no agent
# program: the image holds none), once on an encrypted one after Claude Code came into
# the live session and the network went away (the installation copies it), and once
# with a network (both agent programs are downloaded to the disk) followed by a
# software update to a release made on the spot (installed on trial, kept from
# starting, started, gone back from). It takes about 40
# minutes, so it runs for minor releases only: on the commit "chore(release): prepare
# X.Y.0", before that commit is tagged. Patch releases rely on the evaluation in ci.yml.
# To run it for anything else: Actions, Image, Run workflow (all of it, or one part).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests:
        description: Which installations to run
        type: choice
        default: all
        options: [all, install, update]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [ "$EVENT" = workflow_dispatch ] ||
             printf '%s\n' "$subject" | grep -Eq '^chore\(release\): prepare [0-9]+\.[0-9]+\.0$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a minor release (\"$subject\"): the image is not built."
          fi

  install:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
      - name: Build the image
        run: |
          nix build .#iso --out-link image
          ls -l image/iso/
          df -h /
      # Claude Code is not SlateOS's to hand on: the image names it and does not hold it.
      - name: No agent program on the image
        run: distro/release/check-image.sh
      - name: QEMU and firmware
        run: |
          nix build --inputs-from . nixpkgs#qemu_kvm --out-link qemu
          echo "$PWD/qemu/bin" >> "$GITHUB_PATH"
          echo "OVMF_FV=$(nix build --inputs-from . nixpkgs#OVMF.fd --no-link --print-out-paths)/FV" >> "$GITHUB_ENV"
      - name: Install without a network, and boot
        if: inputs.tests != 'update'
        run: python3 tests/image/install_test.py --iso image/iso/*.iso --firmware "$OVMF_FV/OVMF.fd" --workdir "$RUNNER_TEMP/plain" --offline
      - name: Install and boot, encrypted disk, Claude Code from the live session
        if: inputs.tests != 'update'
        run: python3 tests/image/install_test.py --iso image/iso/*.iso --firmware "$OVMF_FV/OVMF.fd" --workdir "$RUNNER_TEMP/encrypted" --encrypt --live-agent
      # With the firmware's variable store, as computers have one: the trial start of an
      # update is a variable the boot loader reads at the next start.
      - name: Install, boot, update, a version that does not start, the way back
        if: inputs.tests != 'install'
        run: >-
          python3 tests/image/install_test.py --iso image/iso/*.iso --workdir "$RUNNER_TEMP/update"
          --firmware "$OVMF_FV/OVMF_CODE.fd" --firmware-vars "$OVMF_FV/OVMF_VARS.fd" --update "$PWD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-install
          path: |
            ${{ runner.temp }}/plain/*.log
            ${{ runner.temp }}/plain/*.png
            ${{ runner.temp }}/encrypted/*.log
            ${{ runner.temp }}/encrypted/*.png
            ${{ runner.temp }}/update/*.log
            ${{ runner.temp }}/update/*.png
          if-no-files-found: ignore
