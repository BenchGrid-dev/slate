name: Image

# Builds the x86_64 image, installs it in a virtual machine and boots what was installed
# (tests/image/install_test.py), once on a plain disk and once on an encrypted one. It
# takes about 25 minutes, so it runs for minor releases only: on the commit
# "chore(release): prepare X.Y.0", before that commit is tagged. Patch releases rely on
# the evaluation in ci.yml. To run it for anything else: Actions, Image, Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [ "$EVENT" = workflow_dispatch ] ||
             printf '%s\n' "$subject" | grep -Eq '^chore\(release\): prepare [0-9]+\.[0-9]+\.0$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a minor release (\"$subject\"): the image is not built."
          fi

  install:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
      - name: Build the image
        run: |
          nix build .#iso --out-link image
          ls -l image/iso/
          df -h /
      - name: QEMU and firmware
        run: |
          nix build --inputs-from . nixpkgs#qemu_kvm --out-link qemu
          echo "$PWD/qemu/bin" >> "$GITHUB_PATH"
          echo "OVMF_FD=$(nix build --inputs-from . nixpkgs#OVMF.fd --no-link --print-out-paths)/FV/OVMF.fd" >> "$GITHUB_ENV"
      - name: Install and boot
        run: python3 tests/image/install_test.py --iso image/iso/*.iso --workdir "$RUNNER_TEMP/plain"
      - name: Install and boot, encrypted disk
        run: python3 tests/image/install_test.py --iso image/iso/*.iso --workdir "$RUNNER_TEMP/encrypted" --encrypt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-install
          path: |
            ${{ runner.temp }}/plain/*.log
            ${{ runner.temp }}/plain/*.png
            ${{ runner.temp }}/encrypted/*.log
            ${{ runner.temp }}/encrypted/*.png
          if-no-files-found: ignore
